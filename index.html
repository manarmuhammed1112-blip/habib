<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06162d">
<title>حبيب ميديا للدعاية والإعلان</title>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(21,55,105,.45), transparent 38%),
      linear-gradient(180deg, #07172e 0%, #031022 100%);
    color: #fff;
    font-family: Tahoma, Arial, sans-serif;
  }
  .page {
    width: min(680px, 100%);
    margin: auto;
    padding: 28px 18px 45px;
  }
  .hero {
    text-align: center;
    padding: 8px 0 18px;
  }
  .hero h1 {
    margin: 0 0 7px;
    font-size: clamp(26px, 7vw, 40px);
    font-weight: 900;
    color: #f5bd2e;
    text-shadow: 0 2px 18px rgba(245,189,46,.25);
  }
  .hero a {
    color: inherit;
    text-decoration: none;
  }
  .hero p {
    margin: 0;
    color: #f5f5f5;
    font-size: 17px;
    font-weight: 700;
  }
  .logo {
    display: block;
    width: min(245px, 62vw);
    aspect-ratio: 1;
    object-fit: cover;
    margin: 18px auto 14px;
    border-radius: 28px;
    box-shadow: 0 15px 50px rgba(0,0,0,.35);
  }
  .links {
    display: grid;
    gap: 13px;
    margin-top: 16px;
  }
  .btn {
    min-height: 66px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 14px 20px;
    border: 1.5px solid #e7b52c;
    border-radius: 22px;
    color: #fff;
    text-decoration: none;
    font-size: 19px;
    font-weight: 900;
    background: linear-gradient(135deg, rgba(12,34,65,.98), rgba(4,20,39,.98));
    box-shadow: 0 7px 24px rgba(0,0,0,.22), inset 0 0 20px rgba(239,184,42,.05);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .btn:hover, .btn:active {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0,0,0,.3), 0 0 20px rgba(239,184,42,.14);
  }
  .btn.price {
    background: linear-gradient(135deg, #dca51e, #7f4a08);
    color: #07172e;
    border-color: #ffd75d;
  }
  .icon {
    width: 32px;
    height: 32px;
    display: inline-grid;
    place-items: center;
    flex: 0 0 32px;
    font-size: 25px;
  }
  .section {
    margin-top: 26px;
  }
  .section-title {
    text-align: center;
    margin: 0 0 13px;
    color: #f5bd2e;
    font-size: 23px;
    font-weight: 900;
  }
  .card {
    overflow: hidden;
    border-radius: 22px;
    border: 1px solid rgba(241,187,47,.75);
    box-shadow: 0 10px 35px rgba(0,0,0,.28);
    background: #07182f;
  }
  .card img {
    width: 100%;
    display: block;
    cursor: zoom-in;
  }
  .note {
    text-align: center;
    color: #d9dce3;
    font-size: 14px;
    margin-top: 10px;
  }
  .footer {
    text-align: center;
    margin-top: 30px;
    color: #aeb8c8;
    font-size: 13px;
  }
  .modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 15px;
    background: rgba(0,0,0,.88);
    z-index: 1000;
  }
  .modal.show { display: flex; }
  .modal img {
    max-width: 100%;
    max-height: 92vh;
    object-fit: contain;
    border-radius: 12px;
  }
  .close {
    position: fixed;
    top: 14px;
    left: 16px;
    width: 45px;
    height: 45px;
    border: 0;
    border-radius: 50%;
    background: #f5bd2e;
    color: #07172e;
    font-size: 28px;
    font-weight: 900;
    cursor: pointer;
  }
  @media (max-width: 420px) {
    .page { padding-left: 13px; padding-right: 13px; }
    .btn { min-height: 61px; font-size: 17px; border-radius: 19px; }
  }

  .prices-page {
    display: none;
    width: min(680px, 100%);
    margin: 0 auto;
    padding: 22px 18px 45px;
  }
  body.prices-open .page { display: none; }
  body.prices-open .prices-page { display: block; }
  .back-btn {
    border: 1px solid #e7b52c;
    background: transparent;
    color: #f5bd2e;
    border-radius: 18px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .prices-header {
    text-align: center;
    margin-bottom: 18px;
  }
  .prices-header h2 {
    margin: 0 0 6px;
    color: #f5bd2e;
    font-size: clamp(25px, 7vw, 34px);
  }
  .prices-header p {
    margin: 0;
    color: #fff;
    font-weight: 700;
  }
  .prices-page .card {
    margin-bottom: 18px;
  }
  .prices-actions {
    margin-top: 8px;
  }
  .prices-actions .btn {
    width: 100%;
  }

  .package-list { display:grid; gap:14px; margin:18px 0; }
  .package-btn {
    width:100%; min-height:82px; display:grid;
    grid-template-columns:52px 1fr 28px; align-items:center; gap:12px;
    padding:12px 18px; text-align:right; color:#fff;
    background:linear-gradient(135deg,#0d294b,#061529);
    border:1.5px solid #e7b52c; border-radius:22px;
    cursor:pointer; box-shadow:0 8px 25px rgba(0,0,0,.28);
  }
  .package-btn:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(245,189,46,.15); }
  .medal { font-size:34px; }
  .package-text strong { display:block; font-size:20px; color:#fff; }
  .package-text small { display:block; margin-top:5px; font-size:17px; color:#f5bd2e; font-weight:900; }
  .arrow { color:#f5bd2e; font-size:25px; }
  .package-page { display:none; width:min(680px,100%); margin:auto; padding:22px 18px 45px; }
  body.package-open .page, body.package-open .prices-page { display:none; }
  body.package-open .package-page { display:block; }
  .package-detail {
    background:linear-gradient(180deg,#0b213e,#051326);
    border:1px solid #e7b52c; border-radius:24px; padding:24px 20px;
    box-shadow:0 10px 35px rgba(0,0,0,.3); margin-top:8px;
  }
  .package-detail h2 { margin:0 0 8px; color:#f5bd2e; font-size:30px; text-align:center; }
  .package-detail .price { text-align:center; font-size:35px; color:#f5bd2e; font-weight:900; margin:10px 0 22px; }
  .package-detail .old { text-align:center; color:#bbb; text-decoration:line-through; margin-bottom:20px; }
  .package-detail ul { list-style:none; padding:0; margin:0; }
  .package-detail li { padding:13px 5px; border-bottom:1px solid rgba(255,255,255,.13); font-size:18px; }
  .package-detail li::before { content:"✓"; color:#f5bd2e; font-weight:900; margin-left:10px; }
  .package-whatsapp { margin-top:18px; width:100%; }

</style>
</head>
